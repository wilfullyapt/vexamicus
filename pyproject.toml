[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vexamicus"
version = "0.1.0"
description = "Vexamicus: Salto-class monoped body runtime (sim-first MotionBus + dog modes)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vexamicus contributors" }]
keywords = ["robotics", "monoped", "hopper", "sim", "ami", "mobile-ami"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
]

[project.scripts]
vexamicus = "vexamicus.cli:main"

[project.urls]
Homepage = "https://github.com/wilfullyapt/vexamicus"
Repository = "https://github.com/wilfullyapt/vexamicus"
Issues = "https://github.com/wilfullyapt/vexamicus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vexamicus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
